button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:2vh;padding-block:2.4vh 2.6vh;max-width:1800px;margin:0 auto}
header{display:flex;align-items:center;gap:2.4vw;min-width:0}
header img.lock{height:21vh;width:auto;max-width:36vw;box-sizing:content-box;padding:1.6vh 2.2vh;background:rgba(255,255,255,.94);border-radius:2vh;box-shadow:0 .6vh 2.4vh rgba(16,39,92,.16)}
.ttl{display:grid;gap:.6vh;min-width:0;flex:1}
.ttl small{font-family:var(--f-display);font-weight:800;letter-spacing:.2em;font-size:max(11px,1.25vh);color:var(--orange);text-transform:uppercase}
.ttl h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:max(20px,5vh);line-height:1;color:var(--navy);text-wrap:balance}
.ttl p{margin:0;font-weight:600;font-size:max(13px,2vh);color:var(--muted)}
.tools{display:flex;gap:.8vh;align-self:flex-start}
.tool{border:0;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border-radius:999px;padding:.9vh 1.6vh;font-family:var(--f-display);font-weight:700;font-size:max(11px,1.4vh);color:var(--navy);box-shadow:0 1px 0 rgba(16,39,92,.08)}
.tool:hover{background:#fff}
.tool[aria-pressed="false"]{opacity:.55}

/* board */
.board{align-self:center;justify-self:center;display:grid;grid-template-columns:repeat(6,var(--cw));gap:calc(var(--cw)*.13);perspective:1600px}
.slot{position:relative;width:var(--cw);aspect-ratio:2/3;max-width:100%;container-type:inline-size}
.card{position:absolute;inset:0;border:0;padding:0;background:none;border-radius:calc(var(--cw)*.05);transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease}
.slot.down .card:hover{transform:translateY(-1.2vh) rotate(-1deg)}
.slot.hot .card{transform:translateY(-2vh) scale(1.05)}
.slot.hot .card::after{content:"";position:absolute;inset:-.8vh;border-radius:calc(var(--cw)*.08);box-shadow:0 0 0 .45vh var(--orange),0 0 4vh rgba(232,80,27,.55);pointer-events:none}
.slot.done .card{cursor:zoom-in}
.slot .badge{position:absolute;left:50%;top:0;transform:translate(-50%,-55%);z-index:3;background:var(--orange);color:#fff;font-family:var(--f-display);font-weight:900;font-size:calc(var(--cw)*.085);letter-spacing:.06em;padding:.5em 1em;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px rgba(232,80,27,.35)}

/* card faces (sizes in cqw so the same card works small and big) */
.face{position:absolute;inset:0;border-radius:5cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1.2cqw 4cqw rgba(16,39,92,.22),0 0 0 .5cqw rgba(255,255,255,.7)}
.back{background:var(--royal);color:#fff;display:grid;place-items:center;text-align:center}

.front .hd small{position:relative;font-weight:800;font-size:3.5cqw;letter-spacing:.16em;opacity:.88}
.front .hd b{position:relative;font-weight:900;font-size:8.8cqw;line-height:1;text-wrap:balance}
.front .hd i{position:relative;font-style:normal;font-family:var(--f-body);font-weight:700;font-size:4.6cqw;opacity:.95}
.front .pair{flex-shrink:0;display:grid;grid-template-columns:1fr 8cqw 1fr;align-items:start;padding:3.4cqw 3cqw 3cqw;background:linear-gradient(var(--mist),#fff)}
.front .side{display:grid;gap:1.2cqw;justify-items:center;text-align:center;min-width:0}
.front .art{width:25cqw;aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 0 0 .5cqw var(--line)}
.front .art svg,.front .art img{width:80%;height:80%;object-fit:contain}
.front .art img{mix-blend-mode:multiply}
.front .cty{display:flex;align-items:center;gap:1.4cqw;font-weight:800;font-size:3.2cqw;letter-spacing:.12em;color:var(--muted)}
.front .cty svg{width:6cqw;height:4cqw;border-radius:.5cqw;box-shadow:0 0 0 .3cqw var(--line)}
.front .side b{font-weight:900;font-size:4.5cqw;line-height:1.1;color:var(--navy)}
.front .side span{font-family:var(--f-body);font-weight:600;font-size:3.3cqw;line-height:1.3;color:var(--muted)}
.front .x{align-self:center;margin-top:-14cqw;display:grid;place-items:center;width:8cqw;aspect-ratio:1;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;font-size:5cqw}
.front .qs{flex:1;min-height:0;padding:3.4cqw 6cqw 2cqw;display:grid;align-content:start;gap:1.8cqw;border-top:.5cqw solid #E3EAF5}
.front .qs > b{font-weight:800;font-size:3.6cqw;letter-spacing:.16em;color:var(--orange)}
.front .qs ol{margin:0;padding:0;list-style:none;display:grid;gap:1.6cqw;counter-reset:q}
.front .qs li{counter-increment:q;display:grid;grid-template-columns:6.4cqw 1fr;gap:2cqw;font-family:var(--f-body);font-weight:600;font-size:3.95cqw;line-height:1.28}
.front .qs li::before{content:counter(q);display:grid;place-items:center;width:6.4cqw;aspect-ratio:1;border-radius:50%;background:var(--mist);color:var(--royal);font-family:var(--f-display);font-weight:900;font-size:3.6cqw}
.front .ft{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:2.4cqw 6cqw;border-top:.5cqw solid #E3EAF5;font-weight:800;font-size:2.9cqw;letter-spacing:.12em;color:var(--royal)}
.front .ft em{font-family:var(--f-script);font-style:normal;letter-spacing:0;font-size:4cqw;color:var(--orange);font-weight:400}

/* bottom bar */
.bar{display:flex;align-items:center;justify-content:center;gap:3vw;flex-wrap:wrap}
.groups{display:flex;gap:1vh;flex-wrap:wrap;justify-content:center}
.grp{border:0;border-radius:1.4vh;padding:1vh 1.8vh;min-width:12vh;display:grid;gap:.2vh;text-align:left;background:rgba(255,255,255,.8);backdrop-filter:blur(6px);box-shadow:0 0 0 2px transparent;transition:box-shadow .2s,background .2s}
.grp b{font-family:var(--f-display);font-weight:900;font-size:max(13px,2.1vh);color:var(--navy)}
.grp span{font-weight:700;font-size:max(10px,1.45vh);color:var(--muted);white-space:nowrap}
.grp[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 .35vh var(--orange)}
.grp.done{background:rgba(31,79,193,.92)}
.grp.done b,.grp.done span{color:#fff}
.go{border:0;border-radius:999px;padding:1.9vh 4.4vh;background:var(--orange);color:#fff;font-family:var(--f-display);font-weight:900;font-size:max(16px,3vh);letter-spacing:.06em;box-shadow:0 .7vh 0 #B53A0F,0 1.4vh 3vh rgba(232,80,27,.35);display:flex;align-items:center;gap:1.4vh;transition:transform .12s, box-shadow .12s}
.go small{font-family:var(--f-body);font-weight:700;font-size:.55em;letter-spacing:0;opacity:.9}
.go:active{transform:translateY(.5vh);box-shadow:0 .2vh 0 #B53A0F,0 .8vh 2vh rgba(232,80,27,.3)}
.go:disabled{background:#9AA9C4;box-shadow:0 .7vh 0 #6F7E9C;cursor:default}
.hint{font-weight:600;font-size:max(11px,1.45vh);color:var(--muted);text-align:center}
.hint kbd{font-family:var(--f-display);font-weight:800;background:rgba(255,255,255,.85);padding:.1em .5em;border-radius:.4em;color:var(--navy)}

/* reveal stage */
.stage{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none}
.stage .dim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(16,39,92,.55),rgba(10,24,60,.88));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .5s}
.stage.on{pointer-events:auto}
.stage.on .dim{opacity:1}
.rays{position:absolute;width:150vmax;aspect-ratio:1;left:50%;top:50%;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(255,236,190,.20) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);opacity:0;transition:opacity .6s}
.stage.lit .rays{opacity:1;animation:spin 40s linear infinite}
@keyframes spin{to{rotate:360deg}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.big{position:relative;height:min(88vh,128vw);aspect-ratio:2/3;max-width:92vw;container-type:inline-size}
.flip{position:absolute;inset:0;transform-style:preserve-3d}
.who{position:absolute;right:calc(100% + 4vw);top:50%;translate:0 -50%;white-space:nowrap;display:grid;justify-items:end;gap:.4vh;text-align:right;font-family:var(--f-display);font-weight:900;color:#fff;box-shadow:0 6px 18px rgba(232,80,27,.45);opacity:0;transform:translateY(1vh);transition:opacity .4s,transform .4s}
.who small{font-weight:800;font-size:max(12px,2vh);letter-spacing:.2em;color:#FFD9C7}
.who b{font-size:max(20px,9vh);line-height:.95}
.who .lnk{margin-top:2vh;font-family:var(--f-body);font-weight:700;font-size:max(12px,1.9vh);color:#fff;background:rgba(255,255,255,.14);padding:.5em .9em;border-radius:.6em;white-space:nowrap}
.who em{font-family:var(--f-script);font-style:normal;font-weight:400;font-size:max(18px,5.5vh);color:#FFB08F}
.stage.lit .who{opacity:1;transform:none}
.closehint{position:absolute;left:calc(100% + 4vw);bottom:0;display:flex;gap:1vh;opacity:0;transition:opacity .4s}
.stage.lit .closehint{opacity:1}
.closehint button{border:0;border-radius:999px;padding:1.4vh 3.2vh;font-family:var(--f-display);font-weight:800;font-size:max(14px,2.4vh);white-space:nowrap;background:#fff;color:var(--navy)}
.closehint button.pri{background:var(--orange);color:#fff}

/* results + confirm sheets */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,24,60,.7);padding:3vh max(16px,env(safe-area-inset-left,0px))}
.sheet[hidden]{display:none}
.panel{background:#fff;border-radius:2vh;padding:3.5vh 4vh;width:min(1100px,100%);max-height:94vh;overflow:auto;display:grid;gap:2.4vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:max(20px,3.8vh);color:var(--navy)}
.panel h2 em{font-family:var(--f-script);font-style:normal;font-weight:400;color:var(--orange)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6vh}
.res div{border-radius:1.4vh;padding:1.8vh 2vh;background:var(--mist);display:grid;gap:.4vh;min-width:0}
.res small{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;color:var(--orange);font-size:max(11px,1.5vh)}
.res b{font-family:var(--f-display);font-weight:900;font-size:max(16px,2.8vh);color:var(--navy);line-height:1.1}
.res span{font-weight:600;color:var(--muted);font-size:max(12px,1.8vh)}
.res .empty b{color:#9AA9C4}
.row{display:flex;gap:1vh;justify-content:flex-end;flex-wrap:wrap}
.row button{border:0;border-radius:999px;padding:1.1vh 2.4vh;font-family:var(--f-display);font-weight:800;font-size:max(13px,1.8vh);background:var(--mist);color:var(--navy)}
.row button.pri{background:var(--orange);color:#fff}
.row button.warn{background:var(--navy);color:#fff}
.panel p{margin:0;font-size:max(14px,2vh);color:var(--muted);max-width:60ch}

@media (max-width:760px){
  :root{--cw:min(27vw,22vh)}
  html,body{height:auto;min-height:100%}
  body{overflow:auto;background-attachment:fixed}
  .app{height:auto;min-height:100%}
  header{flex-wrap:wrap}
  header img.lock{height:auto;width:52vw;max-width:52vw;padding:2vw 3vw}
  .ttl{flex-basis:100%}
  .tools{order:-1;width:100%;justify-content:flex-end}
  .board{grid-template-columns:repeat(3,var(--cw));row-gap:5vh;margin-top:3vh}
  .res{grid-template-columns:1fr}
  .big{height:min(74vh,128vw)}
  .who{right:auto;left:50%;top:0;translate:-50% -110%;justify-items:center;text-align:center;grid-auto-flow:column;align-items:baseline;gap:2vw}
  .who b{font-size:7vw}.who .lnk{margin-top:2vh;font-family:var(--f-body);font-weight:700;font-size:max(12px,1.9vh);color:#fff;background:rgba(255,255,255,.14);padding:.5em .9em;border-radius:.6em;white-space:nowrap}
.who em{font-size:6vw}.who small{display:none}
  .closehint{left:50%;bottom:auto;top:100%;translate:-50% 2vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const N=6;

const ONSITE=location.protocol.startsWith('http')&&!/claude/.test(location.hostname);
const SYNC='/api/topicdraw',SKEY='ismart-3010';
function push(){if(!ONSITE)return;fetch(SYNC,{method:'POST',headers:{'content-type':'application/json','x-draw-key':SKEY},body:JSON.stringify({order:st.order,owner:st.owner})}).then(r=>showSync(r.ok)).catch(()=>showSync(false))}
function showSync(ok){const e=document.getElementById('sync');e.hidden=false;e.textContent=ok?'● Laptop nhóm: đã gửi':'● Laptop nhóm: chưa kết nối';e.style.color=ok?'#2E6B34':'#B53A0F'}
const backHTML=()=>`<div class="face back"><div class="frame"></div><div class="mid"><small>TOPIC CARD</small><div class="q">?</div><div class="scr">Sharing Cultures</div><div class="vs">VIETNAM × SINGAPORE</div></div></div>`;
const frontHTML=(ti)=>{const t=TOPICS[ti];return `<div class="face front"><div class="hd"><small>TOPIC ${ti+1} · CHỦ ĐỀ ${ti+1}</small><b>${t.en.replace('&','&amp;')}</b><i>${t.vi}</i></div>
<div class="pair"><div class="side"><div class="art">${ART[t.vnA]}</div><div class="cty">${FLAG.vn}VIETNAM</div><b>${t.vn}</b><span>${t.vnS}</span></div><div class="x">×</div>
<div class="side"><div class="art">${ART[t.sgA]}</div><div class="cty">${FLAG.sg}SINGAPORE</div><b>${t.sg}</b><span>${t.sgS}</span></div></div>
<div class="qs"><b>TALK ABOUT</b><ol>${t.q.map(x=>`<li>${x}</li>`).join('')}</ol></div>
<div class="ft"><span>VIETNAM × SINGAPORE</span><em>Building Friendships</em></div></div>`};

/* ---------- state ---------- */
const KEY='topicdraw-v1';
function shuffled(){const a=[...Array(N).keys()];for(let i=a.length-1;i>0;i--){const r=new Uint32Array(1);crypto.getRandomValues(r);const j=r[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let st;
function fresh(){return {order:shuffled(),owner:Array(N).fill(null),hist:[],sel:0,sound:true}}
try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||!Array.isArray(st.order)||st.order.length!==N)st=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const groupDone=g=>st.owner.includes(g);
const slotOf=g=>st.owner.indexOf(g);
const remaining=()=>st.owner.map((o,i)=>o===null?i:-1).filter(i=>i>=0);
function nextGroup(){for(let k=0;k<N;k++){const g=(st.sel+k)%N;if(!groupDone(g))return g}return -1}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const board=$('#board'),groupsEl=$('#groups'),go=$('#go');
function render(){
  board.innerHTML='';
  for(let i=0;i<N;i++){
    const o=st.owner[i],s=document.createElement('div');
    s.className='slot '+(o===null?'down':'done');s.dataset.i=i;
    s.innerHTML=(o===null?'':`<div class="badge">GROUP ${o+1}</div>`)+`<button class="card" aria-label="${o===null?'Thẻ úp số '+(i+1):'Nhóm '+(o+1)+': '+TOPICS[st.order[i]].en}">${o===null?backHTML():frontHTML(st.order[i])}</button>`;
    board.appendChild(s);
  }
  groupsEl.innerHTML='';
  for(let g=0;g<N;g++){
    const b=document.createElement('button'),sl=slotOf(g);
    b.className='grp'+(sl>=0?' done':'');b.dataset.g=g;
    b.setAttribute('aria-pressed',String(g===st.sel&&sl<0));
    b.innerHTML=`<b>Group ${g+1}</b><span>${sl>=0?TOPICS[st.order[sl]].en:'Chưa bốc · Nhóm '+(g+1)}</span>`;
    groupsEl.appendChild(b);
  }
  const left=remaining().length;
  go.disabled=left===0||busy;
  go.innerHTML=left===0?'ĐÃ BỐC XONG <small>All drawn</small>':`BỐC THĂM · GROUP ${st.sel+1} <small>Draw</small>`;
  $('#bSound').setAttribute('aria-pressed',String(st.sound));
}

/* ---------- sound (Web Audio, starts on first press) ---------- */
let ac;
function ctx(){if(!st.sound)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d,type='sine',v=.18,when=0){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
const tick=()=>tone(1150,.06,'triangle',.16);
function whoosh(){const c=ctx();if(!c)return;const len=c.sampleRate*.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(500,c.currentTime);f.frequency.exponentialRampToValueAtTime(3000,c.currentTime+.45);g.gain.value=.25;s.connect(f).connect(g).connect(c.destination);s.start()}
function fanfare(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.9-i*.1,'triangle',.16,i*.09));tone(1567.98,1.2,'sine',.07,.36)}

/* ---------- confetti ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
const COLS=['#E8501B','#1F4FC1','#4AACCE','#E9A92A','#FFFFFF','#F7A27E','#9FD3E8'];
function burst(){
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio,k=devicePixelRatio;
  const add=(x,y,ang,spread,sp,n)=>{for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*spread,v=sp*(.55+Math.random()*.6)*k;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:(4+Math.random()*6)*k,c:COLS[i%COLS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,sh:Math.random()<.35?1:0,life:0})}};
  add(W/2,H*.45,0,Math.PI*2,15,140);
  add(0,H,-Math.PI/3.2,.5,26,70);add(W,H,-Math.PI+Math.PI/3.2,.5,26,70);
  if(!raf)loop();
}
function loop(){
  const H=cv.height;cx.clearRect(0,0,cv.width,H);
  parts=parts.filter(p=>p.y<H+40&&p.life<420);
  for(const p of parts){p.life++;p.vx*=.985;p.vy=p.vy*.985+.32*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.sh){cx.beginPath();cx.arc(0,0,p.r*.5,0,7);cx.fill()}else{cx.scale(1,Math.abs(Math.cos(p.life*.12+p.rot)));cx.fillRect(-p.r/2,-p.r*.3,p.r,p.r*.6)}
    cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,H);
}

/* ---------- draw flow ---------- */
let busy=false,openSlot=-1;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

async function shuffleAnim(){
  const slots=[...board.querySelectorAll('.slot.down')];if(slots.length<2||reduce)return;
  whoosh();
  const br=board.getBoundingClientRect(),cxm=br.left+br.width/2;
  const anims=slots.map((s,k)=>{const r=s.getBoundingClientRect(),dx=cxm-(r.left+r.width/2),rot=(k-(slots.length-1)/2)*4;
    return s.querySelector('.card').animate([{transform:'none'},{transform:`translateX(${dx}px) rotate(${rot}deg)`,offset:.35},{transform:`translateX(${dx+(k%2?-30:30)}px) rotate(${-rot}deg)`,offset:.55},{transform:`translateX(${dx}px) rotate(${rot/2}deg)`,offset:.7},{transform:'none'}],{duration:1300,easing:'cubic-bezier(.6,0,.3,1)'})});
  await Promise.all(anims.map(a=>a.finished));
}
async function roulette(target){
  const rem=remaining();if(rem.length<2||reduce)return;
  const pos=rem.indexOf(target),steps=rem.length*3+pos;
  let d=55;
  for(let s=0;s<=steps;s++){
    board.querySelectorAll('.slot.hot').forEach(e=>e.classList.remove('hot'));
    board.querySelector(`.slot[data-i="${rem[s%rem.length]}"]`).classList.add('hot');tick();
    const left=steps-s;d=left<6?d*1.45:d*1.04;await wait(Math.min(d,520));
  }
  await wait(380);
}
async function draw(pick){
  if(busy)return;const rem=remaining();if(!rem.length)return;
  const g=groupDone(st.sel)?nextGroup():st.sel;if(g<0)return;st.sel=g;
  busy=true;render();ctx();
  let target=pick;
  if(target===undefined){const r=new Uint32Array(1);crypto.getRandomValues(r);target=rem[r[0]%rem.length];await shuffleAnim();await roulette(target)}
  else{const el=board.querySelector(`.slot[data-i="${target}"]`);el.classList.add('hot');tick();await wait(450)}
  st.owner[target]=g;st.hist.push(target);save();push();
  await reveal(target,true);
}
async function reveal(i,isNew){
  openSlot=i;const slot=board.querySelector(`.slot[data-i="${i}"]`),stage=$('#stage'),flip=$('#flip'),big=$('#big');
  flip.innerHTML=(isNew?backHTML():'')+frontHTML(st.order[i]).replace('class="face front"','class="face front"');
  $('#who').innerHTML=`<small>${isNew?'VỪA BỐC ĐƯỢC':'CHỦ ĐỀ CỦA'}</small><b>Group ${st.owner[i]+1}</b><em>Nhóm ${st.owner[i]+1}</em>${ONSITE?`<span class="lnk">${location.host}/topicdraw/${SLUG[st.order[i]]}</span>`:''}`;
  stage.classList.add('on');
  const r=slot.getBoundingClientRect(),b=big.getBoundingClientRect();
  const dx=r.left+r.width/2-(b.left+b.width/2),dy=r.top+r.height/2-(b.top+b.height/2),sc=r.width/b.width;
  slot.style.visibility='hidden';slot.classList.remove('hot');
  const from=`translate(${dx}px,${dy}px) scale(${sc}) rotateY(${isNew?0:180}deg)`;
  if(isNew){
    whoosh();
    await flip.animate([{transform:from},{transform:`translate(${dx*.4}px,${dy*.4-40}px) scale(${Math.min(1,sc*2.2)}) rotateY(0deg) rotateZ(-4deg)`,offset:.35},{transform:'translate(0,0) scale(1.06) rotateY(200deg)',offset:.85},{transform:'translate(0,0) scale(1) rotateY(180deg)'}],{duration:reduce?1:1500,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'}).finished;
    stage.classList.add('lit');fanfare();if(!reduce)burst();
  }else{
    await flip.animate([{transform:from},{transform:'rotateY(180deg)'}],{duration:reduce?1:550,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'}).finished;
    stage.classList.add('lit');
  }
  $('#bClose').focus({preventScroll:true});
}
async function closeReveal(){
  if(openSlot<0)return;const i=openSlot;openSlot=-1;
  const stage=$('#stage'),flip=$('#flip'),big=$('#big');
  render();const slot=board.querySelector(`.slot[data-i="${i}"]`);slot.style.visibility='hidden';
  const r=slot.getBoundingClientRect(),b=big.getBoundingClientRect();
  const dx=r.left+r.width/2-(b.left+b.width/2),dy=r.top+r.height/2-(b.top+b.height/2),sc=r.width/b.width;
  stage.classList.remove('lit');
  await flip.animate([{transform:'rotateY(180deg)'},{transform:`translate(${dx}px,${dy}px) scale(${sc}) rotateY(180deg)`}],{duration:reduce?1:650,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'}).finished;
  slot.style.visibility='';stage.classList.remove('on');flip.getAnimations().forEach(a=>a.cancel());flip.innerHTML='';
  busy=false;const n=nextGroup();if(n>=0)st.sel=n;save();render();
  if(!remaining().length)setTimeout(showResults,500);
}

$('#bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{
  if(!sheet.hidden){if(e.key==='Escape')sheet.hidden=true;return}
  if(e.code==='Space'||e.key==='Enter'){if(e.target.closest&&e.target.closest('.tool'))return;e.preventDefault();if(openSlot>=0&&$('#stage').classList.contains('lit'))closeReveal();else if(!busy)draw();}
  else if(e.key==='Escape'&&openSlot>=0)closeReveal();
  else if(/^[1-6]$/.test(e.key)&&!busy){const g=+e.key-1;if(!groupDone(g)){st.sel=g;save();render()}}
  else if(e.key==='f'||e.key==='F')$('#bFull').click();
  else if(e.key==='m'||e.key==='M')$('#bSound').click();
});
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
if(groupDone(st.sel)){const n=nextGroup();if(n>=0)st.sel=n}
render();
</script>

</body>
</html>
